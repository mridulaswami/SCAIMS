<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SCAIMS Email Verification</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, sans-serif;">

<div style="max-width:600px; margin:40px auto; background:#ffffff; padding:35px; border-radius:10px;">

    <h2 style="margin-top:0; color:#222;">
        Welcome to SCAIMS
    </h2>

    <p style="font-size:15px; color:#444;">
        Hello <strong th:text="${name}">User</strong>,
    </p>

    <p style="font-size:15px; color:#444;">
        Thank you for registering with SCAIMS.
        Please use the following OTP to verify your email address.
    </p>

    <div style="text-align:center; margin:30px 0;">

        <div style="
            display:inline-block;
            padding:15px 30px;
            background:#f1f3f5;
            border-radius:8px;
            font-size:32px;
            font-weight:bold;
            letter-spacing:8px;
            color:#222;
        "
             th:text="${otp}">
            123456
        </div>

    </div>

    <p style="text-align:center; font-size:14px; color:#666;">
        This OTP is valid for
        <strong th:text="${expiryMinutes}">5</strong>
        minutes.
    </p>

    <p style="font-size:14px; color:#555;">
        If you did not create an account with SCAIMS, please ignore this email.
    </p>

    <hr style="border:none; border-top:1px solid #eee; margin:30px 0;">

    <p style="font-size:13px; color:#888; margin-bottom:0;">
        Regards,<br>
        <strong>SCAIMS Team</strong>
    </p>

</div>

</body>
</html>
