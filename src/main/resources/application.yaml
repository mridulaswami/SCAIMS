spring:
  application:
    name: USER-MANAGEMENT-SERVICE

  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: 8003
  servlet:
    context-path: /user-management-service


app:
  jwt:
    secret: your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
